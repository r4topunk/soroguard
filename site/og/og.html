<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>soroguard og image</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Onest:wght@400;500;600&family=Geist+Mono:wght@400;500&display=block">
<style>
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; background: #F2F4F3; color: #13201F; font-family: "Onest", system-ui, sans-serif; -webkit-font-smoothing: antialiased;
    background-image: radial-gradient(900px 480px at 18% -120px, rgba(11,107,105,0.10), rgba(11,107,105,0) 70%); }
  .disp { font-family: "Bricolage Grotesque", system-ui, sans-serif; }
  .mono { font-family: "Geist Mono", ui-monospace, monospace; }
  .frame { box-sizing: border-box; width: 1200px; height: 630px; padding: 56px 56px 56px 64px; display: grid; grid-template-columns: 1fr 470px; gap: 48px; align-items: center; }
  .left { display: flex; flex-direction: column; gap: 26px; }
  .mark { display: flex; align-items: center; gap: 12px; }
  .mark span.logo { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 14px; background: #0B6B69; }
  h1 { margin: 0; font-size: 57px; white-space: nowrap; line-height: 1.02; letter-spacing: -0.035em; font-weight: 700; }
  h1 span { display: block; }
  h1 span + span { color: #5E6B6A; font-weight: 600; }
  p { margin: 0; font-size: 22px; line-height: 1.45; color: #4F5C5B; max-width: 34ch; }
  .key { align-self: flex-start; display: inline-flex; align-items: center; gap: 14px; padding: 10px 20px 10px 10px; border-radius: 22px; background: #FFFFFF;
    box-shadow: inset 0 -1px 0 #E6EBEA, 0 5px 0 #D9E0DE, 0 22px 40px -24px rgba(11,107,105,0.45); }
  .key .ic { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 13px; background: #DDEFEC; color: #0B6B69; }
  .key .mono { font-size: 21px; }
  .card { box-sizing: border-box; height: 518px; padding: 22px; border-radius: 28px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(19,32,31,0.04), 0 30px 60px -40px rgba(19,52,50,0.35); }
  svg text { font-family: "Onest", system-ui, sans-serif; }
  svg .mono { font-family: "Geist Mono", ui-monospace, monospace; }
  svg .disp { font-family: "Bricolage Grotesque", system-ui, sans-serif; }
</style>
</head>
<body>
<div class="frame">
  <div class="left">
    <div class="mark">
      <span class="logo"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5.5c0 4.6-3 8.1-7 9.5-4-1.4-7-4.9-7-9.5V6z"/><path d="M9 12l2 2 4-4"/></svg></span>
      <span class="disp" style="font-size: 28px; font-weight: 700; letter-spacing: -0.02em;">soroguard</span>
    </div>
    <h1 class="disp"><span>Paste a contract.</span><span>Get the threat model.</span></h1>
    <p>Reads a Soroban contract's deployed WASM, no source code needed, and writes a STRIDE threat model and on-chain monitoring plan.</p>
    <div class="key">
      <span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7l5 5-5 5"/><path d="M13 17h6"/></svg></span>
      <span class="mono">npx soroguard artifact <span style="color: #0B6B69;">&lt;contract-id&gt;</span></span>
    </div>
  </div>

  <div class="card">
    <svg width="426" height="474" viewBox="0 0 426 474">
      <defs>
        <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0.5 L9 5 L0 9.5 z" fill="#9AA6A4"/></marker>
        <marker id="arr-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0.5 L9 5 L0 9.5 z" fill="#0B6B69"/></marker>
        <marker id="arr-b" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0.5 L9 5 L0 9.5 z" fill="#A66F0A"/></marker>
        <marker id="arr-c" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0.5 L9 5 L0 9.5 z" fill="#4760B5"/></marker>
      </defs>

      <!-- 1 contract id -->
      <rect x="0" y="0" width="426" height="58" rx="16" fill="#F2F4F3"/>
      <text x="20" y="35" font-size="15" fill="#5E6B6A">Contract ID</text>
      <text x="406" y="36" text-anchor="end" class="mono" font-size="19" font-weight="500" fill="#13201F">CDZZ5HUO…742T5</text>
      <path d="M213 60 V86" stroke="#9AA6A4" stroke-width="1.6" marker-end="url(#arr)"/>

      <!-- 2 wasm -->
      <rect x="0" y="90" width="426" height="58" rx="16" fill="#F2F4F3"/>
      <text x="20" y="127" class="disp" font-size="23" font-weight="700" fill="#13201F">WASM</text>
      <text x="406" y="125" text-anchor="end" font-size="15" fill="#5E6B6A">deployed, no source code</text>
      <path d="M213 150 V176" stroke="#9AA6A4" stroke-width="1.6" marker-end="url(#arr)"/>

      <!-- 3 functions -> host functions -->
      <rect x="0" y="180" width="426" height="128" rx="18" fill="#F2F4F3"/>
      <rect x="16" y="222" width="172" height="42" rx="13" fill="#FFFFFF"/>
      <text x="30" y="248" class="mono" font-size="15.5" fill="#13201F">initialize_escrow</text>
      <g fill="none" stroke="#A9B4B2" stroke-width="1.5" stroke-linecap="round">
        <path d="M188 243 C218 243 218 214 246 214"/>
        <path d="M188 243 C218 243 218 274 246 274"/>
      </g>
      <circle cx="218" cy="228" r="9" fill="#FBEAE2" stroke="#C4552B" stroke-width="1.4"/>
      <path d="M214.5 224.5l7 7M221.5 224.5l-7 7" stroke="#C4552B" stroke-width="1.6" stroke-linecap="round"/>
      <rect x="246" y="196" width="164" height="36" rx="18" fill="#FFFFFF"/>
      <circle cx="263" cy="214" r="4.5" fill="#13201F"/>
      <text x="275" y="219" class="mono" font-size="14.5" fill="#13201F">require_auth</text>
      <rect x="246" y="256" width="164" height="36" rx="18" fill="#FFFFFF"/>
      <circle cx="263" cy="274" r="4.5" fill="#13201F"/>
      <text x="275" y="279" class="mono" font-size="14.5" fill="#13201F">contract_event</text>

      <!-- tier lines -->
      <path d="M70 310 V366" stroke="#0B6B69" stroke-width="2.4" fill="none" marker-end="url(#arr-a)"/>
      <circle cx="70" cy="336" r="11" fill="#DDEFEC" stroke="#0B6B69" stroke-width="1.4"/>
      <text x="70" y="340.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0A5E5C">A</text>
      <path d="M150 310 V366" stroke="#4760B5" stroke-width="2.8" stroke-dasharray="0.1 6" stroke-linecap="round" fill="none" marker-end="url(#arr-c)"/>
      <circle cx="150" cy="336" r="11" fill="#E4E9F6" stroke="#4760B5" stroke-width="1.4"/>
      <text x="150" y="340.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#34509E">C</text>
      <path d="M320 310 V366" stroke="#A66F0A" stroke-width="2.4" stroke-dasharray="7 5" fill="none" marker-end="url(#arr-b)"/>
      <circle cx="320" cy="336" r="11" fill="#F6ECD4" stroke="#A66F0A" stroke-width="1.4"/>
      <text x="320" y="340.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#855300">B</text>

      <!-- 4 two documents -->
      <rect x="0" y="372" width="200" height="102" rx="18" fill="#F2F4F3"/>
      <g transform="translate(18 390)" fill="none" stroke="#13201F" stroke-width="1.6" stroke-linejoin="round"><path d="M1 1h10l6 6v15H1z"/><path d="M11 1v6h6"/></g>
      <text x="44" y="407" class="disp" font-size="18" font-weight="700" fill="#13201F">Threats</text>
      <text x="18" y="436" class="mono" font-size="13.5" fill="#5E6B6A">threat-model.md</text>
      <text x="18" y="460" class="mono" font-size="14" fill="#13201F">Elevation.1</text>

      <path d="M202 438 H224" stroke="#C9D1CF" stroke-width="1.5"/>
      <text x="213" y="428" text-anchor="middle" font-size="11.5" fill="#5E6B6A">ID</text>

      <rect x="226" y="372" width="200" height="102" rx="18" fill="#F2F4F3"/>
      <g transform="translate(244 390)" fill="none" stroke="#13201F" stroke-width="1.6" stroke-linejoin="round"><path d="M1 1h10l6 6v15H1z"/><path d="M11 1v6h6"/></g>
      <text x="270" y="407" class="disp" font-size="18" font-weight="700" fill="#13201F">Monitoring</text>
      <text x="244" y="436" class="mono" font-size="13.5" fill="#5E6B6A">monitoring-plan.md</text>
      <text x="244" y="460" class="mono" font-size="14" fill="#13201F">Elevation.1.M.1</text>
    </svg>
  </div>
</div>
</body>
</html>
